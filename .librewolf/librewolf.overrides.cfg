// ============================================================================
//  librewolf.overrides.cfg  —  personal overrides for LibreWolf's hardened defaults
// ----------------------------------------------------------------------------
//  Deployed by ~/.dots (GNU Stow, `gui` package) to ~/.librewolf/librewolf.overrides.cfg
//  It is read AFTER the packaged librewolf.cfg, so anything set here WINS and is
//  re-applied on every launch (this is why about:config edits to hardened prefs
//  don't otherwise stick).
//
//  Syntax is Mozilla AutoConfig (JS-ish), NOT prefs.js. Available functions:
//     defaultPref("x", v)  set the DEFAULT (still changeable in about:config,     <- preferred
//                          reapplied each start; runtime changes persist per profile)
//     pref("x", v)         set the current value
//     lockPref("x", v)     set AND lock (greyed-out / uneditable in about:config)
//     clearPref("x")       reset to the built-in default
//  Comments: // line   or   /* block */.   Changes take effect after a restart.
//
//  Everything below uses defaultPref so you can still toggle live in about:config.
//  Trim to taste — the "privacy trade-offs" section is commented out on purpose;
//  uncomment only what you actually need.
// ============================================================================


// ===[ Quality-of-life (safe, low-risk) ]=====================================

// Restore my previous windows & tabs on startup (1 = homepage, 3 = restore session).
defaultPref("browser.startup.page", 3);

// Keep search-in-address-bar working (also required for DuckDuckGo !bangs & keyword
// searches to resolve from the URL bar).
defaultPref("keyword.enabled", true);

// Middle-click / hold autoscroll.
defaultPref("general.autoScroll", true);

// Remember form-field entries (search boxes, etc.).
defaultPref("browser.formfill.enable", true);

// Smooth-ish spell check in text areas.
defaultPref("layout.spellcheckDefault", 1);


// ===[ Stay logged in across restarts ]=======================================
// LibreWolf wipes cookies + history on shutdown, so you're logged out of
// everything every time you close it. This block keeps sessions/history.
// >>> Comment this whole block out to restore LibreWolf's clear-on-exit privacy. <<<

// Master switch for the "clear on shutdown" sweep.
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);

// Belt-and-suspenders granular keys (names differ across Firefox versions; setting
// unknown ones is harmless). Old-style:
defaultPref("privacy.clearOnShutdown.cookies", false);
defaultPref("privacy.clearOnShutdown.history", false);
defaultPref("privacy.clearOnShutdown.sessions", false);
defaultPref("privacy.clearOnShutdown.offlineApps", false);
// Firefox 128+ (_v2) keys:
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);

// Don't downgrade all cookies to session-only (LibreWolf sets 2 = delete on close;
// 0 = keep until they expire). May be a no-op on newer builds where it's deprecated.
defaultPref("network.cookie.lifetimePolicy", 0);


// ===[ Downloads ]============================================================
// true = save straight to the download dir; false = ask every time. Pick one.
defaultPref("browser.download.useDownloadDir", true);
// defaultPref("browser.download.dir", "/home/YOURUSER/Downloads");   // must be absolute — ~ is not expanded
// defaultPref("browser.download.folderList", 2);   // 2 = use the custom dir above


// ===[ Privacy / security trade-offs — OPT IN by uncommenting ]================
// Each of these RELAXES a LibreWolf hardening default. Enable only if you need it.

// -- resistFingerprinting (RFP) --
// RFP is LibreWolf's strongest anti-fingerprinting measure but it also forces a
// light theme, spoofs your timezone, adds letterbox bars, and standardises the
// window size. Turn it fully off:
// defaultPref("privacy.resistFingerprinting", false);
// ...or keep RFP but drop just the grey letterbox bars around pages:
// defaultPref("privacy.resistFingerprinting.letterboxing", false);

// -- WebGL -- (LibreWolf disables it; needed for maps, some games, 3D canvas)
// defaultPref("webgl.disabled", false);

// -- DRM / EME -- (needed for Netflix, Spotify Web, Amazon Video, etc.)
// defaultPref("media.eme.enabled", true);
// defaultPref("media.gmp-widevine.enabled", true);

// -- Firefox Sync -- (LibreWolf disables the account UI)
// defaultPref("identity.fxaccounts.enabled", true);

// -- Built-in password manager -- (LibreWolf disables saving logins)
// defaultPref("signon.rememberSignons", true);

// -- Search suggestions from your default engine as you type --
// defaultPref("browser.search.suggest.enabled", true);
// defaultPref("browser.urlbar.suggest.searches", true);


