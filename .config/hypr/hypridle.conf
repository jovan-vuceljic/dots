# hypridle — read from here by default. Timeouts are long on purpose: this box is
# driven over VNC, and a lock you can't see is a lost session.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Lua mode: `hyprctl dispatch` evaluates Lua, and only the table form is a real
    # on/off (a bare "on" string toggles) — same finding as the dots hypridle.conf
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
