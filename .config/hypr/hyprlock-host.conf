# hyprlock sizes for this VM — 1920x1080 (the VNC client's screen; the headless output
# follows it). hyprlock.conf ships sizes tuned for wm's 3072x1728 logical panel; these are
# those values × 0.625 (same set as lw's), which keeps the proportions the layout was built
# around (clock ~13% of screen height, date ~2.5%, meta ~1.5%, logo ~16%).
$fsClock = 138
$fsDate = 28
$fsMeta = 16
$fsSmall = 15
$fsIcon = 25
$logoSize = 175
