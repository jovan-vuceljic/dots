# hyprpaper — the wallpaper. `path` is a link to the chosen image, kept outside the repo so the
# choice survives logins: change it with ~/.config/hypr/scripts/wallpaper.sh <image>, or Dolphin's
# right-click → Set as wallpaper. Default (fresh box): wallpapers/foss_wallpaper_edit.png.
splash = false

wallpaper {
    monitor =                           # empty = every monitor, incl. HEADLESS-VNC created after login
    path = ~/.local/state/hypr/wallpaper
    fit_mode = cover
}
