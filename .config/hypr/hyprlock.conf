#! █▀█ ░█░ █▀▀ █▀▄ █▄▄ █▄█ █▄▄ █░█

#*  Hyprlock Configuration File

# Laid out in three bands -- TOP / MIDDLE / BOTTOM -- each anchored with valign so the
# layout holds at any resolution. Every `position` and `size` is a percentage, which
# hyprlock accepts because both are LAYOUTCONFIG values.
#
# `font_size` and `image:size` are plain ints in hyprlock 0.9.6 and cannot take a
# percentage, so they can't scale on their own. They're hoisted into the variables below:
# retune those few numbers for a very different screen (this box is 3072x1728 logical),
# or `source` a per-host file that redefines them, as kitty.conf does with host.conf.
#
# Coordinates: +x is right, +y is UP. So with valign = top, y must be negative to move
# down into the screen; with valign = bottom, positive y moves up.

$fontColor = rgba(255,255,255,0.5)
$fontFamily = SourceCodeVF ExtraBold
$timeFontFamily = Cantarell ExtraBold

# Type scale — tuned for this box's 3072x1728 logical screen. Since these can't be
# percentages, they are the one thing to retune on a very different display: they are
# roughly clock 13%, date 2.5%, meta 1.5% of screen height.
$fsClock = 220
$fsDate = 44
$fsMeta = 26
$fsSmall = 24
$fsIcon = 40
$logoSize = 280

general {
  ignore_empty_input = true
  text_trim = true
}
# Dropped as of hyprlock 0.9.6 — it rejected all four as "config option does not exist"
# and carried on without them, so they never took effect:
#   no_fade_in / fade_in_time  -> fade-in is CLI-only now: lockscreen.sh --no-fade-in
#   grade, disable_loading_bar -> no equivalent

background {
  monitor =
  path = ~/.config/hypr/hyprlock/assets/background.jpg
  # Heavier blur than you'd expect: the wallpaper has "open source" set across its
  # middle, which otherwise reads as text competing with the clock sitting on top of it.
  blur_passes = 3
  blur_size = 6
  contrast = 0.7
  brightness = 0.38
  vibrancy = 0.15
  vibrancy_darkness = 0.5
}


# // ▀█▀ █▀█ █▀█
# // ░█░ █▄█ █▀▀

# uptime
label {
  monitor =
  text = cmd[update:5000] echo "<span alpha='40%'>$(uptime -p)</span>"
  color = $fontColor
  font_family = $fontFamily
  font_size = $fsMeta
  position = 0, -6%
  halign = center
  valign = top
}

# greeting / weather
label {
  monitor =
  text = cmd[update:300000] echo "<span alpha='50%'>$(cat ~/.config/fish/greet.txt)</span>"
  color = $fontColor
  font_family = $fontFamily
  font_size = $fsSmall
  position = 0, -9%
  halign = center
  valign = top
}


# // █▀▄▀█ █ █▀▄ █▀▄ █░░ █▀▀
# // █░▀░█ █ █▄▀ █▄▀ █▄▄ ██▄

image {
  monitor =
  path = ~/.config/hypr/hyprlock/assets/logo.jpg
  size = $logoSize
  position = 0, 10%
  halign = center
  valign = center
  reload_time = -1
  reload_cmd =
}

input-field {
  monitor =
  size = 20%, 5%
  position = 0, -3%
  halign = center
  valign = center
  outline_thickness = 3
  dots_size = 0.08
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgba(0,0,0,0.1)
  inner_color = $fontColor
  fade_on_empty = true
}


# // █▄▄ █▀█ ▀█▀ ▀█▀ █▀█ █▀▄▀█
# // █▄█ █▄█ ░█░ ░█░ █▄█ █░▀░█

# date — sits directly above the clock
label {
  monitor =
  text = cmd[update:1000] echo "<span alpha='50%'>$(LC_TIME=en_US.UTF-8 date +'%A, %B %d')</span>"
  color = $fontColor
  font_family = $fontFamily
  font_size = $fsDate
  position = 0, 22%
  halign = center
  valign = bottom
}

# clock — bottom edge lines up with the power button / battery row.
# 10% = the power row's 4% plus half the clock's own height, so the boxes bottom out
# together; drop it much lower and the descenders clip off the screen.
label {
  monitor =
  text = cmd[update:1000] echo "<span alpha='50%'>$(date +"%H:%M")</span>"
  color = $fontColor
  font_family = $timeFontFamily
  font_size = $fsClock
  position = 0, 10%
  halign = center
  valign = bottom
  shadow_passes = 1
  shadow_size = 1
  shadow_color = rgba(0, 0, 0, 0.5)
}

# power
label {
  monitor =
  text = cmd[] echo "<span alpha='50%'>⏻ </span>"
  color = $fontColor
  font_size = $fsIcon
  onclick = systemctl poweroff
  position = 3%, 4%
  halign = left
  valign = bottom
}

# battery (prints nothing on a desktop)
label {
  monitor =
  text = cmd[update:1000] echo -e "<span alpha='50%'>$(~/.config/hypr/battery.sh)</span>"
  color = $fontColor
  font_family = $fontFamily
  font_size = $fsSmall
  position = -3%, 4%
  halign = right
  valign = bottom
}
