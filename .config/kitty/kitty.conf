# Colours: theme.conf (Catppuccin Mocha, next to this file), then the own overrides below,
# which win because later definitions override earlier ones.
include theme.conf

background         #262335
foreground         #ffffff
# none = the tab bar uses the background above (theme.conf sets #11111B)
tab_bar_background none

font_size 12.0
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
window_padding_width 25
enable_audio_bell no
cursor_trail 1
cursor_blink_interval 0.4 ease-in-out

tab_bar_style       powerline
tab_powerline_style slanted

confirm_os_window_close 0
# Remembering size also remembers the maximize state (~/.cache/kitty/main.json):
# close one maximized kitty and every new one opens maximized under Hyprland.
remember_window_size no
initial_window_width 100c
initial_window_height 30c
#background_opacity 0.60
#hide_window_decorations yes

